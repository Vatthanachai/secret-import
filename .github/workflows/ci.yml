# Build and test on every supported OS (ADR-0011: the 90% line/branch coverage gate runs here too).
name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        # TreatWarningsAsErrors is on in Directory.Build.props, so any warning fails here.
        run: dotnet build -c Release --no-restore

      - name: Test with coverage gate
        # coverlet.msbuild thresholds in tests/Directory.Build.props fail the run below 90% line or branch.
        # Integration tests (Category=Integration) run too; the SDK is installed above.
        run: dotnet test -c Release --no-build -p:CollectCoverage=true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
